<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- /favicon.ico first: Google's favicon crawler requests that exact
         path by convention, and the SPA rewrite used to answer it with
         index.html — a 200 carrying HTML, which reads as a successful fetch
         of something that is not an image. Hence the generic globe in search
         results. The 96px PNG is for Google's "multiple of 48" preference. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StockBolt — Auto Parts ERP for the GCC &amp; India</title>
    <meta name="description" content="Inventory, VAT-ready accounting and POS built for auto-parts traders. Arabic and English, multi-branch, UAE and India tax compliant." />
    <link rel="canonical" href="https://www.stockbolt.online/" />
    <meta name="theme-color" content="#101B33" />

    <!-- Open Graph — WhatsApp, LinkedIn, Facebook, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StockBolt" />
    <meta property="og:url" content="https://www.stockbolt.online/" />
    <meta property="og:title" content="StockBolt — Auto Parts ERP for the GCC &amp; India" />
    <meta property="og:description" content="Inventory, VAT-ready accounting and POS built for auto-parts traders. Arabic and English, multi-branch." />
    <meta property="og:image" content="https://www.stockbolt.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AE" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StockBolt — Auto Parts ERP for the GCC &amp; India" />
    <meta name="twitter:description" content="Inventory, VAT-ready accounting and POS built for auto-parts traders." />
    <meta name="twitter:image" content="https://www.stockbolt.online/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
